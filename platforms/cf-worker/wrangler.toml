name = "fuzd-cf-worker"
main = "src/worker.ts"
compatibility_date = "2023-08-14"

compatibility_flags = [ "nodejs_compat" ] # for node:async_hooks

[observability]
enabled = true
head_sampling_rate = 1 # optional. default = 1.

[env.production]

d1_databases = [
  { binding = "DB", database_name = "fuzd-db", database_id = "3b9d30e7-6f33-4607-b4cd-4448e4d88951" }
]

[triggers]
crons = ["* * * * *", "*/1 * * * *", "*/2 * * * *"]

# A copy of production on its own worker and D1, for load tests (tests/load). Create the database
# once with `wrangler d1 create fuzd-db-staging`, paste its id below, then `pnpm init-db:staging`.
# Secrets (HD_MNEMONIC, TOKEN_ADMIN, CHAIN_<id>) are per env: `wrangler secret put <NAME> -e staging`.
[env.staging]
name = "fuzd-cf-worker-staging"
d1_databases = [
  { binding = "DB", database_name = "fuzd-db-staging", database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create" }
]

[env.staging.triggers]
crons = ["* * * * *", "*/1 * * * *", "*/2 * * * *"]
